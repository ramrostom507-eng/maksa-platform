name: Build MAKSA ARAB iOS Simulator App
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/ios-build.yml"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run build:web
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Build iOS Simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build build
      - name: Package simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/MAKSA-ARAB-iOS-Simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: MAKSA-ARAB-iOS-Simulator
          path: MAKSA-ARAB-iOS-Simulator.zip
          if-no-files-found: error
