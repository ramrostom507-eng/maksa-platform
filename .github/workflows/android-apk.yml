name: Build MAKSA ARAB Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Generate MAKSA ARAB launcher icons
        run: |
          npm install --no-save sharp
          node scripts/make-icons.mjs
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK for direct download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MAKSA-ARAB.apk
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: MAKSA ARAB Android v1.0.1
          files: MAKSA-ARAB.apk
          fail_on_unmatched_files: true
